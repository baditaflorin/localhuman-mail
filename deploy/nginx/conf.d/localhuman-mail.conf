map $http_origin $cors_origin {
  default "";
  "https://baditaflorin.github.io" $http_origin;
  "http://localhost:5173" $http_origin;
  "http://127.0.0.1:5173" $http_origin;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host:25342$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

  location = /metrics {
    return 404;
  }

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
      add_header Access-Control-Max-Age 300 always;
      return 204;
    }

    limit_req zone=api_limit burst=30 nodelay;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://app:8080;
  }
}

