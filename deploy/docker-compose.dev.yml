services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.0-dev"
        COMMIT: "dev"
        BUILD_TIME: "dev"
    image: localhuman-mail:dev
    environment:
      LOCALHUMAN_ADDR: ":8080"
      LOCALHUMAN_DATA_DIR: "/data"
      LOCALHUMAN_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://baditaflorin.github.io"
      LOCALHUMAN_LOG_LEVEL: "debug"
      LOCALHUMAN_OLLAMA_URL: "http://host.docker.internal:11434"
    ports:
      - "8080:8080"
    read_only: false

