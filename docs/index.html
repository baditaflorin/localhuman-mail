<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>localhuman-mail</title>
    <meta
      name="description"
      content="Privacy-first AI email client with local mailbox indexing, semantic search, and assistive drafting."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #172033;
      }

      main {
        max-width: 720px;
        padding: 40px 24px;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 1;
        margin: 0 0 16px;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>localhuman-mail</h1>
      <p>
        Privacy-first AI email client with local mailbox indexing, semantic
        search, and assistive drafting.
      </p>
      <div class="links">
        <a href="https://github.com/baditaflorin/localhuman-mail">GitHub repository</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support on PayPal</a>
      </div>
    </main>
  </body>
</html>
